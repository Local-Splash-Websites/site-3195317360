# Generated by Dudaport. Included from the official httpd:2.4 image's httpd.conf.
ServerTokens Prod
ServerSignature Off
PassEnv LEADS_SERVICE_URL
DirectoryIndex index.html
DirectorySlash Off
AddType image/webp .webp
AddType font/woff2 .woff2
AddType font/woff .woff
AddOutputFilterByType DEFLATE text/html text/css application/javascript image/svg+xml application/xml text/plain

<Directory "/usr/local/apache2/htdocs">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<LocationMatch "^/assets/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

RewriteEngine On

# Leads: the browser posts to the site's own domain; the shared lead service identifies the site from the
# X-Forwarded-Host header that mod_proxy adds. Internal proxying uses plain http.
ProxyTimeout 30
RewriteCond %{ENV:LEADS_SERVICE_URL} !^$
RewriteRule ^/v1/lead/?$ %{ENV:LEADS_SERVICE_URL}/v1/lead [P,L]

# Pages keep their Duda URLs: /about is served from about.html (with or without a trailing slash).
RewriteCond %{DOCUMENT_ROOT}$1.html -f
RewriteRule ^(/.+?)/?$ $1.html [L]
